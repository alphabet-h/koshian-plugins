# plugins/trap-book/schema/kb-mcp-schema.toml
# kb-mcp validate will enforce these on every .md file under ~/.claude-trap-book/.

[fields.title]
required = true
type = "string"
min_length = 5

[fields.category]
required = true
type = "string"
enum = ["pitfall", "strategy"]

[fields.topic]
required = true
type = "string"
pattern = '^[a-z0-9]+(/[a-z0-9]+)*$'

[fields.date]
required = true
type = "string"
pattern = '^\d{4}-\d{2}-\d{2}$'

[fields.schema_version]
required = true
type = "integer"
min = 1

[fields.status]
required = true
type = "string"
enum = ["auto_extracted", "verified", "deprecated"]

[fields.confidence]
required = true
type = "number"
min = 0.0
max = 1.0

[fields.confirmation_count]
required = true
type = "integer"
min = 1

[fields.project]
required = true
type = "string"

[fields.tags]
required = true
type = "array"
min_items = 1
max_items = 3

[fields.evidence_sessions]
required = true
type = "array"
min_items = 1

[fields.extracted_by]
required = true
type = "string"

[fields.ttl_days]
required = false
type = "integer"
min = 1
